    <script>
// Restores a deep link after the 404.html redirect (GitHub Pages has no
// SPA fallback): 404.html stashes the app path in sessionStorage, this
// puts it back in the address bar before the app boots.
(function () {
  var redirect = null;
  try { redirect = sessionStorage.getItem('hackenstein-redirect'); sessionStorage.removeItem('hackenstein-redirect'); } catch (e) {}
  if (redirect) history.replaceState(null, '', '/hackenstein-katie-preview' + redirect);
})();
</script>
